<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Analyze website performance, accessibility, best practices and SEO, then get a prioritized list of what to fix."
    />
    <title>trace</title>
    <script>
      // Runs before first paint so the theme never flashes. Dark is the default.
      // Keep the storage key in sync with THEME_STORAGE_KEY in src/hooks/useTheme.ts.
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('trace-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {
          /* storage blocked — fall back to dark */
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
